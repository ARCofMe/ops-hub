[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-hub"
version = "0.1.0"
description = "Unified Discord-facing operations hub for appliance repair operations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "pydantic-settings>=2.4,<3",
    "Pillow>=11,<12",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
ops-hub = "ops_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]
